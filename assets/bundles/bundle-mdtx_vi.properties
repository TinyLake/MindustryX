overlayUI.tips = [gold]Mẹo:[]\n1. Phím tắt mặc định trên PC là Z, có thể đổi trong cài đặt.\n2. Sau khi khóa bảng, bảng có thể hiển thị trong trò chơi.\n3. Không phải bảng nào cũng cần khóa; công tắc bên trái có thể dùng để thu gọn.\n4. Sau khi khóa, vùng nội dung giữ nguyên và sẽ bám vào mép.\n5. Trên di động, có thể chỉnh độ phóng đại trong cài đặt cửa sổ; thông tin có thể được rút gọn và nút có thể phóng to.
forceJoin.tips = [gold]MDTX[]: Phiên bản mục tiêu có thể tương thích; bạn có thể giả dạng phiên bản để buộc tham gia.\nNếu gặp [red]lỗi mạng[] hoặc vấn đề khác thì phiên bản không tương thích.\n\nMẸO: Tương thích ngược (từ v146 đến phiên bản hiện tại) là tính năng riêng của MDTX.

